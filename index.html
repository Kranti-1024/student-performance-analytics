<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Performance analytics System</title>
<style>
:root{--ink:#172033;--muted:#687386;--line:#e5eaf2;--blue:#315efb;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#111b2d;color:white;padding:32px max(20px,calc((100% - 1150px)/2))}header small{color:#aebfff;letter-spacing:.15em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(28px,4vw,42px);line-height:1.1;margin:10px 0}header p{color:#c8d0df;margin:0}main{max-width:1150px;margin:25px auto;padding:0 18px 40px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 28px #1c2b4610}.metric{padding:18px}.metric label{font-size:13px;color:var(--muted)}.metric strong{display:block;font-size:28px;margin-top:7px}.section{margin:25px 0 12px;font-size:18px}.analysis{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:20px}.panel h3{margin:0 0 14px;font-size:15px}.subject{display:grid;grid-template-columns:50px 1fr 40px;gap:10px;align-items:center;margin:14px 0;font-size:13px}.track{height:9px;background:#edf0f5;border-radius:10px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#315efb,#8b9bff)}.leader{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:10px;border-radius:11px;margin:9px 0}.rank{background:#eef2ff;color:#315efb;padding:7px 10px;border-radius:9px;font-weight:800}.grow{flex:1}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.toolbar button,.upload{font:inherit;border:1px solid #dce2eb;border-radius:10px;padding:10px 12px;background:white}.toolbar input{flex:1;min-width:210px}.toolbar button{cursor:pointer;background:#e9edff;color:#2548c9;font-weight:700}.upload{cursor:pointer;font-size:13px;font-weight:700}.upload input{display:none}.tablebox{overflow:auto}.tablehead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0f5;font-size:13px}th{font-size:11px;color:var(--muted);background:#fafbfe;text-transform:uppercase;cursor:pointer}tr:hover td{background:#f8faff}.pill{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800}.pass{background:#e2f7ec;color:#13724f}.fail{background:#fff0f1;color:#b72c44}.grade{background:#eef2ff;color:#354fca}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.analysis{grid-template-columns:1fr}}@media(max-width:430px){.grid{gap:8px}.metric{padding:12px}.metric strong{font-size:23px}main{padding:0 11px 25px}}
</style></head><body>
<header><h1>Student Performance analytics System</h1></header>
<main><section class="grid" id="metrics"></section><h2 class="section">Performance overview</h2><section class="analysis"><div class="card panel"><h3>Subject-wise averages</h3><div id="subjects"></div></div><div class="card panel"><h3>Top performers</h3><div id="leaders"></div></div></section>
<h2 class="section">Student records</h2><div class="toolbar"><input id="search" placeholder="Search name, ID or department"><select id="dept"><option value="">All departments</option></select><select id="result"><option value="">All results</option><option>Pass</option><option>Fail</option></select><label class="upload">Import CSV<input type="file" id="upload" accept=".csv"></label><button id="export">Export CSV</button></div>
<div class="card tablebox"><div class="tablehead"><strong>Class register</strong><span id="count" class="muted"></span></div><table><thead><tr><th data-k="ID">ID ↕</th><th data-k="name">Student ↕</th><th data-k="DEPT">Department ↕</th><th data-k="ATDN">Attendance ↕</th><th data-k="DS">DS ↕</th><th data-k="AI">AI ↕</th><th data-k="ML">ML ↕</th><th data-k="DL">DL ↕</th><th data-k="Total Marks">Total ↕</th><th data-k="Average">Average ↕</th><th data-k="Grade">Grade ↕</th><th data-k="Result">Result ↕</th></tr></thead><tbody id="body"></tbody></table></div></main>
<script>
const initial=[{"name": "Kranti", "ID": 1, "DEPT": "AIDS", "ATDN": 87, "age": 21, "DS": 45, "AI": 45, "ML": 53, "DL": 98}, {"name": "Ritesh", "ID": 2, "DEPT": "AIDS", "ATDN": 87, "age": 21, "DS": 65, "AI": 64, "ML": 67, "DL": 56}, {"name": "Samarth", "ID": 3, "DEPT": "AIDS", "ATDN": 98, "age": 23, "DS": 76, "AI": 65, "ML": 86, "DL": 55}, {"name": "Aditya", "ID": 4, "DEPT": "AIDS", "ATDN": 78, "age": 21, "DS": 87, "AI": 54, "ML": 56, "DL": 43}, {"name": "Omkar", "ID": 5, "DEPT": "AIDS", "ATDN": 67, "age": 19, "DS": 80, "AI": 34, "ML": 64, "DL": 7}, {"name": "Sumit", "ID": 6, "DEPT": "CS", "ATDN": 67, "age": 21, "DS": 90, "AI": 64, "ML": 65, "DL": 90}, {"name": "Lakhan", "ID": 7, "DEPT": "IT", "ATDN": 87, "age": 23, "DS": 95, "AI": 64, "ML": 54, "DL": 64}, {"name": "Ajinkya", "ID": 8, "DEPT": "ENTC", "ATDN": 98, "age": 22, "DS": 78, "AI": 65, "ML": 34, "DL": 65}, {"name": "Pratik", "ID": 9, "DEPT": "AIML", "ATDN": 56, "age": 21, "DS": 87, "AI": 54, "ML": 64, "DL": 54}, {"name": "Mayur", "ID": 10, "DEPT": "CS", "ATDN": 78, "age": 20, "DS": 34, "AI": 34, "ML": 6, "DL": 34}, {"name": "Anshul", "ID": 11, "DEPT": "IT", "ATDN": 65, "age": 23, "DS": 64, "AI": 64, "ML": 56, "DL": 64}, {"name": "Pranav", "ID": 12, "DEPT": "IT", "ATDN": 78, "age": 21, "DS": 65, "AI": 67, "ML": 87, "DL": 89}, {"name": "Shreyash", "ID": 13, "DEPT": "ENTC", "ATDN": 65, "age": 23, "DS": 54, "AI": 90, "ML": 89, "DL": 43}, {"name": "Yash", "ID": 14, "DEPT": "AIDS", "ATDN": 78, "age": 24, "DS": 34, "AI": 89, "ML": 90, "DL": 53}, {"name": "Mahesh", "ID": 15, "DEPT": "ENTC", "ATDN": 98, "age": 25, "DS": 64, "AI": 64, "ML": 43, "DL": 34}];let students=initial.map(x=>({...x}));const subs=["DS","AI","ML","DL"];let sortKey="Average",dir=-1;
const n=x=>Number(x)||0;function calc(s){let marks=subs.map(k=>n(s[k])),total=marks.reduce((a,b)=>a+b,0),avg=total/4,res=marks.some(x=>x<40)?"Fail":"Pass",g=avg>=95?"A+":avg>=85?"A":avg>=75?"B+":avg>=65?"B":avg>=45?"C":"D";return {...s,ID:n(s.ID),ATDN:n(s.ATDN),...Object.fromEntries(subs.map(k=>[k,n(s[k])])),"Total Marks":total,Average:avg,Grade:res==="Fail"?"F":g,Result:res}}
function safe(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let rows=students.map(calc),count=rows.length,pass=rows.filter(s=>s.Result==="Pass").length,avg=count?rows.reduce((a,s)=>a+s.Average,0)/count:0,att=count?rows.reduce((a,s)=>a+s.ATDN,0)/count:0;
let metrics=[["Students",count,"Student records"],["Class average",avg.toFixed(2),"Out of 100"],["Avg. attendance",att.toFixed(1)+"%","Across the class"],["Pass rate",count?(pass/count*100).toFixed(1)+"%":"0%",pass+" passed · "+(count-pass)+" failed"]];
document.getElementById("metrics").innerHTML=metrics.map(m=>`<div class="card metric"><label>${m[0]}</label><strong>${m[1]}</strong><span class="muted">${m[2]}</span></div>`).join("");
document.getElementById("subjects").innerHTML=subs.map(k=>{let a=count?rows.reduce((s,r)=>s+r[k],0)/count:0;return `<div class="subject"><b>${k}</b><div class="track"><div class="bar" style="width:${Math.min(100,a)}%"></div></div><span>${a.toFixed(1)}</span></div>`}).join("");
document.getElementById("leaders").innerHTML=[...rows].sort((a,b)=>b.Average-a.Average).slice(0,3).map((s,i)=>`<div class="leader"><span class="rank">${i+1}</span><div class="grow"><b>${safe(s.name)}</b><div class="muted">${safe(s.DEPT)} · ${s.Result}</div></div><b>${s.Average.toFixed(2)}</b></div>`).join("");
let ds=[...new Set(rows.map(s=>s.DEPT))].sort(),sel=document.getElementById("dept"),old=sel.value;sel.innerHTML='<option value="">All departments</option>'+ds.map(d=>`<option>${safe(d)}</option>`).join("");sel.value=ds.includes(old)?old:"";
let q=document.getElementById("search").value.toLowerCase(),d=sel.value,r=document.getElementById("result").value;let f=rows.filter(s=>(!q||[s.name,s.ID,s.DEPT].some(x=>String(x).toLowerCase().includes(q)))&&(!d||s.DEPT===d)&&(!r||s.Result===r));
f.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];return (typeof x==="string"?x.localeCompare(y):x-y)*dir});document.getElementById("count").textContent=`Showing ${f.length} of ${count}`;
document.getElementById("body").innerHTML=f.map(s=>`<tr><td>${s.ID}</td><td><b>${safe(s.name)}</b></td><td>${safe(s.DEPT)}</td><td>${s.ATDN}%</td><td>${s.DS}</td><td>${s.AI}</td><td>${s.ML}</td><td>${s.DL}</td><td>${s["Total Marks"]}</td><td><b>${s.Average.toFixed(2)}</b></td><td><span class="pill grade">${s.Grade}</span></td><td><span class="pill ${s.Result==="Pass"?"pass":"fail"}">${s.Result}</span></td></tr>`).join("")||'<tr><td colspan="12">No matching students.</td></tr>'}
["search","dept","result"].forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",render));document.querySelectorAll("th[data-k]").forEach(t=>t.addEventListener("click",()=>{if(sortKey===t.dataset.k)dir*=-1;else{sortKey=t.dataset.k;dir=1}render()}));
document.getElementById("export").onclick=()=>{let cols=["ID","name","DEPT","ATDN","age","DS","AI","ML","DL","Total Marks","Average","Grade","Result"],rows=students.map(calc),csv=[cols.join(","),...rows.map(s=>cols.map(k=>'"'+String(s[k]??"").replace(/"/g,'""')+'"').join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="student-performance-report.csv";a.click();URL.revokeObjectURL(a.href)};
function csvParse(text){let lines=text.trim().split(/\r?\n/);function parse(line){let a=[],v="",q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){v+='"';i++}else if(c==='"')q=!q;else if(c===","&&!q){a.push(v);v=""}else v+=c}a.push(v);return a}let heads=parse(lines[0]).map(x=>x.trim());return lines.slice(1).filter(Boolean).map(l=>Object.fromEntries(heads.map((h,i)=>[h,parse(l)[i]||""])))}
document.getElementById("upload").onchange=async e=>{try{let file=e.target.files[0];if(!file)return;let next=csvParse(await file.text());if(!next.length||!["name","ID","DEPT","ATDN",...subs].every(k=>k in next[0]))throw Error("Required columns: name, ID, DEPT, ATDN, DS, AI, ML, DL");students=next;render();alert("CSV imported for this session.")}catch(err){alert("Import failed: "+err.message)}e.target.value=""};render();
</script></body></html>
